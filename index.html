<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Age Calculator</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎂 Age Calculator</h1>
    <p class="subtitle">Calculate your exact age instantly</p>

    <div class="input-group">
        <label>Day</label>
        <input type="number" id="day" placeholder="DD" min="1" max="31">
    </div>

    <div class="input-group">
        <label>Month</label>
        <input type="number" id="month" placeholder="MM" min="1" max="12">
    </div>

    <div class="input-group">
        <label>Year</label>
        <input type="number" id="year" placeholder="YYYY" min="1900" max="2100">
    </div>

    <button onclick="calculateAge()">
        Calculate Age
    </button>

    <div class="result">

        <div class="card">
            <h2 id="years">0</h2>
            <span>Years</span>
        </div>

        <div class="card">
            <h2 id="months">0</h2>
            <span>Months</span>
        </div>

        <div class="card">
            <h2 id="days">0</h2>
            <span>Days</span>
        </div>

    </div>

    <div class="info">

        <p>Total Days :
            <b id="totalDays">0</b>
        </p>

        <p>Total Weeks :
            <b id="totalWeeks">0</b>
        </p>

        <p>Total Months :
            <b id="totalMonths">0</b>
        </p>

        <p>Next Birthday :
            <b id="nextBirthday">0 Days Left</b>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
